<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telemetry 即時儀表板</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; background: #0b1420; color: #eaf1fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1600px; margin: auto; }
    header, .toolbar, .status, .legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header { justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 1.7rem; margin: 0 0 5px; }
    h2 { font-size: 1.08rem; margin: 0 0 13px; }
    p { margin: 0; color: #9cb0c8; }
    label { display: grid; gap: 5px; font-size: .8rem; color: #a9bad0; }
    select { background: #18283a; color: #fff; border: 1px solid #35506b; border-radius: 8px; padding: 9px 11px; min-width: 160px; }
    button { background: #254460; color: #fff; border: 1px solid #4a7294; border-radius: 8px; padding: 9px 14px; cursor: pointer; align-self: end; }
    .status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: .85rem; color: #a9bad0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #687b90; }
    .dot.online { background: #40d695; box-shadow: 0 0 12px #40d695; }
    .dot.stale { background: #efb75c; }
    .devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 670px), 1fr)); gap: 18px; align-items: start; }
    .slot-controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 18px; }
    .slot-control { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: #101f30; border: 1px solid #35506b; border-radius: 10px; padding: 12px; }
    .slot-control strong { align-self: center; min-width: 54px; }
    .device-panel { background: #101f30; border: 1px solid #35506b; border-radius: 14px; padding: 18px; min-width: 0; }
    .device-panel h2 { font-size: 1.18rem; overflow-wrap: anywhere; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { background: #142538; border: 1px solid #29425c; border-radius: 12px; padding: 13px; min-width: 0; }
    .card h3 { font-size: .94rem; margin: 0 0 9px; }
    .velocity-card, .pose-card { grid-column: 1 / -1; }
    canvas.chart { display: block; width: 100%; height: 210px; }
    canvas.pose { display: block; width: 100%; height: 270px; background: #0c1a29; border-radius: 8px; }
    .legend { font-size: .77rem; margin-top: 5px; color: #c6d5e7; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    .joint-list { height: 100px; overflow: auto; padding: 0; margin: 10px 0 0; list-style: none; font-size: .8rem; color: #a9bad0; columns: 2; }
    .joint-list li { break-inside: avoid; padding: 2px 0; }
    .empty { background: #142538; border: 1px solid #29425c; border-radius: 12px; padding: 24px; color: #a9bad0; }
    .hidden { display: none; }
    @media (max-width: 690px) { .grid { grid-template-columns: 1fr; } body { padding: 14px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>即時 Telemetry</h1><p>iPhone / iPad 感測數值與 2D 骨架</p></div>
    <div class="toolbar">
      <label>時間範圍<select id="range"><option value="60000">最近 1 分鐘</option><option value="300000" selected>最近 5 分鐘</option><option value="900000">最近 15 分鐘</option><option value="3600000">最近 1 小時</option></select></label>
      <button id="pause" type="button" aria-pressed="false">暫停畫面</button>
    </div>
  </header>
  <div class="slot-controls">
    <div class="slot-control"><strong>畫面 1</strong><label>即時設備<select id="slot1Device"><option value="">等待設備資料</option></select></label><label>顯示內容<select id="slot1Mode"><option value="motion">三軸數值</option><option value="body_pose">人體關節點</option></select></label></div>
    <div class="slot-control"><strong>畫面 2</strong><label>即時設備<select id="slot2Device"><option value="">不顯示</option></select></label><label>顯示內容<select id="slot2Mode"><option value="motion">三軸數值</option><option value="body_pose">人體關節點</option></select></label></div>
  </div>
  <p id="message" role="status"></p>
  <div id="devices" class="devices"></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const colors = ['#5ac8fa', '#ffb85c', '#ce8cf5'];
  const prefix = 'VNHumanBodyPoseObservationJointName';
  const edges = [
    ['Neck','LeftShoulder'], ['Neck','RightShoulder'],
    ['LeftShoulder','LeftElbow'], ['LeftElbow','LeftWrist'],
    ['RightShoulder','RightElbow'], ['RightElbow','RightWrist'],
    ['LeftShoulder','LeftHip'], ['RightShoulder','RightHip'], ['LeftHip','RightHip'],
    ['LeftHip','LeftKnee'], ['LeftKnee','LeftAnkle'],
    ['RightHip','RightKnee'], ['RightKnee','RightAnkle']
  ];
  let busy = false;
  let paused = false;
  let knownDeviceIds = '';
  let controlsInitialized = false;
  const modeSignatures = {slot1: '', slot2: ''};
  const panels = new Map();

  function chartCard(title, className, labels) {
    const legend = labels.map((label, index) =>
      `<span><i class="swatch" style="background:${colors[index]}"></i>${label}</span>`
    ).join('');
    return `<section class="card motion-card ${className === 'velocity' ? 'velocity-card' : ''}"><h3>${title}</h3><canvas class="chart ${className}"></canvas><div class="legend">${legend}</div></section>`;
  }

  function createPanel(device) {
    const panel = document.createElement('section');
    panel.className = 'device-panel';
    panel.innerHTML = `
      <h2 class="panel-title"></h2>
      <div class="status"><span class="dot"></span><strong class="connection"></strong><span class="seen"></span><span class="panel-error"></span></div>
      <div class="grid">
        ${chartCard('位置 X / Y / Z（公尺）', 'position', ['X', 'Y', 'Z'])}
        ${chartCard('姿態 roll / pitch / yaw（度）', 'attitude', ['roll', 'pitch', 'yaw'])}
        ${chartCard('角速度 X / Y / Z（度／秒）', 'velocity', ['X', 'Y', 'Z'])}
        <section class="card pose-card"><h3>最新 2D 人體骨架</h3><canvas class="pose"></canvas><ul class="joint-list"></ul></section>
      </div>`;
    panel.querySelector('.panel-title').textContent = `${device.device_kind} · ${device.device_id}`;
    return panel;
  }

  async function getJSON(url) {
    const response = await fetch(url, {cache: 'no-store'});
    if (!response.ok) throw new Error(`${response.status} ${url}`);
    return response.json();
  }

  function canvasContext(canvas) {
    const rect = canvas.getBoundingClientRect();
    const scale = window.devicePixelRatio || 1;
    const width = Math.max(rect.width, 1), height = Math.max(rect.height, 1);
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, width, height);
    return {ctx, width, height};
  }

  function drawChart(canvas, samples, group, keys, start, end) {
    const {ctx, width, height} = canvasContext(canvas);
    const margin = {left: 53, right: 14, top: 14, bottom: 27};
    const w = Math.max(width - margin.left - margin.right, 1);
    const h = Math.max(height - margin.top - margin.bottom, 1);
    const values = samples.flatMap(s => keys.map(k => s.motion?.[group]?.[k]).filter(Number.isFinite));
    let min = values.length ? Math.min(...values) : -1;
    let max = values.length ? Math.max(...values) : 1;
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * .12; min -= pad; max += pad;
    ctx.strokeStyle = '#35506b'; ctx.fillStyle = '#91a8c1'; ctx.font = '11px system-ui';
    for (let i = 0; i <= 4; i++) {
      const y = margin.top + h * i / 4;
      ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(margin.left + w, y); ctx.stroke();
      ctx.fillText((max - (max - min) * i / 4).toFixed(1), 2, y + 4);
    }
    const timeLabel = ms => new Date(ms).toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    ctx.fillText(timeLabel(start), margin.left, height - 5);
    ctx.textAlign = 'right'; ctx.fillText(timeLabel(end), width - margin.right, height - 5); ctx.textAlign = 'left';
    keys.forEach((key, index) => {
      ctx.strokeStyle = colors[index]; ctx.lineWidth = 2; ctx.beginPath();
      let drawing = false;
      let lastPoint = null;
      samples.forEach(sample => {
        const value = sample.motion?.[group]?.[key];
        if (!Number.isFinite(value)) { drawing = false; return; }
        const x = margin.left + (sample.timestamp_ms - start) / Math.max(end - start, 1) * w;
        const y = margin.top + (max - value) / (max - min) * h;
        if (drawing) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        lastPoint = [x, y];
        drawing = true;
      });
      ctx.stroke();
      if (lastPoint) { ctx.beginPath(); ctx.arc(lastPoint[0], lastPoint[1], 3, 0, Math.PI * 2); ctx.fillStyle = colors[index]; ctx.fill(); }
    });
    if (!values.length) { ctx.fillStyle = '#91a8c1'; ctx.textAlign = 'center'; ctx.fillText('此時間範圍沒有資料', width / 2, height / 2); ctx.textAlign = 'left'; }
  }

  function drawPose(canvas, list, sample) {
    const {ctx, width, height} = canvasContext(canvas);
    list.replaceChildren();
    const pose = sample?.body_pose;
    const joints = pose?.joints || {};
    const names = Object.keys(joints);
    if (!names.length) {
      ctx.fillStyle = '#91a8c1'; ctx.textAlign = 'center';
      ctx.fillText(sample ? '未偵測到人體' : '尚無骨架資料', width / 2, height / 2);
      return;
    }
    const size = pose.image_size_px;
    const ratio = size ? size.width / size.height : 4 / 3;
    const areaW = width - 32, areaH = height - 32;
    const drawW = Math.min(areaW, areaH * ratio), drawH = drawW / ratio;
    const offsetX = (width - drawW) / 2, offsetY = (height - drawH) / 2;
    ctx.strokeStyle = '#36536d'; ctx.strokeRect(offsetX, offsetY, drawW, drawH);
    const point = joint => [offsetX + joint.x * drawW, offsetY + (1 - joint.y) * drawH];
    ctx.strokeStyle = '#7bd6ff'; ctx.lineWidth = 2.5;
    edges.forEach(([a,b]) => {
      const ja = joints[prefix + a], jb = joints[prefix + b];
      if (!ja || !jb) return;
      const [x1,y1] = point(ja), [x2,y2] = point(jb);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    });
    names.sort().forEach(name => {
      const joint = joints[name], [x,y] = point(joint);
      ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2); ctx.fillStyle = '#ffbe69'; ctx.fill();
      const item = document.createElement('li');
      item.textContent = `${name.replace(prefix, '')}: ${(joint.confidence * 100).toFixed(0)}%`;
      list.appendChild(item);
    });
  }

  function updateStatus(panel, device) {
    const dot = panel.querySelector('.dot'); dot.className = 'dot';
    const seconds = (Date.now() - Date.parse(device.last_seen_at)) / 1000;
    const live = seconds >= 0 && seconds <= 10;
    dot.classList.add(live ? 'online' : 'stale');
    panel.querySelector('.connection').textContent = live ? '連線中' : '暫無新資料';
    panel.querySelector('.seen').textContent = `最後收到：${new Date(device.last_seen_at).toLocaleString('zh-TW')}`;
  }

  async function refreshPanel(slot, device, panel, mode, start, end) {
    try {
      const latest = await getJSON(`/api/devices/${device.device_id}/latest/`);
      if (paused || $(slot + 'Mode').value !== mode || $(slot + 'Device').value !== device.device_id) return;
      const hasData = latest.latest[mode] !== null;
      panel.querySelectorAll('.motion-card').forEach(card => { card.hidden = mode !== 'motion' || !hasData; });
      panel.querySelector('.pose-card').hidden = mode !== 'body_pose' || !hasData;
      updateStatus(panel, latest.device);
      if (mode === 'motion' && hasData) {
        const history = await getJSON(`/api/devices/${device.device_id}/history/?type=motion&start_ms=${start}&end_ms=${end}&limit=2000`);
        if (paused || $(slot + 'Mode').value !== mode || $(slot + 'Device').value !== device.device_id) return;
        drawChart(panel.querySelector('.position'), history.samples, 'position_m', ['x','y','z'], start, end);
        drawChart(panel.querySelector('.attitude'), history.samples, 'attitude_deg', ['roll','pitch','yaw'], start, end);
        drawChart(panel.querySelector('.velocity'), history.samples, 'angular_velocity_deg_s', ['x','y','z'], start, end);
      }
      if (mode === 'body_pose' && hasData) drawPose(panel.querySelector('.pose'), panel.querySelector('.joint-list'), latest.latest.body_pose);
      panel.querySelector('.panel-error').textContent = hasData ? '' : '尚無此類資料';
    } catch (err) {
      if (!paused) panel.querySelector('.panel-error').textContent = `讀取失敗：${err.message}`;
    }
  }

  function updateDeviceControls(devices) {
    const signature = devices.map(device => `${device.device_id}:${device.device_kind}`).sort().join(',');
    if (controlsInitialized && signature === knownDeviceIds) return;
    const first = $('slot1Device'), second = $('slot2Device');
    const previousFirst = first.value, previousSecond = second.value;
    first.replaceChildren(); second.replaceChildren(new Option('不顯示', ''));
    devices.forEach(device => {
      const label = `${device.device_kind} · ${device.device_id.slice(0, 8)}`;
      first.add(new Option(label, device.device_id));
      second.add(new Option(label, device.device_id));
    });
    if (!devices.length) first.add(new Option('等待設備資料', ''));
    const has = id => devices.some(device => device.device_id === id);
    const firstChoice = devices.find(device => device.device_kind === 'iphone') || devices[0];
    const secondChoice = devices.find(device => device.device_kind === 'ipad' && device.device_id !== firstChoice?.device_id);
    first.value = controlsInitialized && has(previousFirst) ? previousFirst : (firstChoice?.device_id || '');
    second.value = controlsInitialized && (previousSecond === '' || has(previousSecond))
      ? previousSecond : (secondChoice?.device_id || '');
    knownDeviceIds = signature;
    if (devices.length) controlsInitialized = true;
  }

  function updateModeControl(slot, device) {
    const select = $(slot + 'Mode');
    const signature = device ? `${device.device_id}:${device.available_types.join(',')}` : 'none';
    if (signature !== modeSignatures[slot]) {
      const previous = select.value;
      select.replaceChildren();
      if (device) {
        device.available_types.forEach(type => select.add(new Option(type === 'motion' ? '三軸數值' : '人體關節點', type)));
        const preferred = slot === 'slot1' ? 'motion' : 'body_pose';
        select.value = modeSignatures[slot] && device.available_types.includes(previous)
          ? previous : (device.available_types.includes(preferred) ? preferred : device.available_types[0]);
      } else {
        select.add(new Option('請先選設備', ''));
      }
      modeSignatures[slot] = signature;
    }
    select.disabled = paused || !device;
  }

  async function refresh() {
    if (busy || paused) return;
    busy = true;
    try {
      const data = await getJSON('/api/devices/');
      if (paused) return;
      updateDeviceControls(data.devices);
      const selected = [];
      for (const slot of ['slot1', 'slot2']) {
        const device = data.devices.find(item => item.device_id === $(slot + 'Device').value);
        updateModeControl(slot, device);
        if (device) selected.push({slot, device, mode: $(slot + 'Mode').value});
      }
      const visibleSlots = new Set(selected.map(item => item.slot));
      for (const [slot, panel] of panels) {
        if (!visibleSlots.has(slot)) { panel.remove(); panels.delete(slot); }
      }
      const container = $('devices');
      for (const {slot, device} of selected) {
        let panel = panels.get(slot);
        if (!panel) {
          panel = createPanel(device);
          panels.set(slot, panel);
          container.appendChild(panel);
        }
        const presentation = `${device.device_id}:${$(slot + 'Mode').value}`;
        if (panel.dataset.presentation !== presentation) {
          panel.dataset.presentation = presentation;
          panel.querySelectorAll('.card').forEach(card => { card.hidden = true; });
          panel.querySelector('.connection').textContent = '讀取中';
          panel.querySelector('.seen').textContent = '';
          panel.querySelector('.panel-error').textContent = '';
        }
        panel.querySelector('.panel-title').textContent = `${slot === 'slot1' ? '畫面 1' : '畫面 2'} · ${device.device_kind} · ${device.device_id}`;
      }
      $('message').textContent = selected.length ? '' : (data.devices.length ? '請選擇至少一台設備。' : '尚無設備資料；請先從 App 傳送資料。');
      const end = Date.now(), start = end - Number($('range').value);
      await Promise.all(selected.map(({slot, device, mode}) => refreshPanel(slot, device, panels.get(slot), mode, start, end)));
    } catch (err) {
      $('message').textContent = `讀取裝置列表失敗：${err.message}`;
    } finally { busy = false; }
  }
  $('pause').addEventListener('click', () => {
    paused = !paused;
    $('pause').textContent = paused ? '繼續即時' : '暫停畫面';
    $('pause').setAttribute('aria-pressed', String(paused));
    for (const slot of ['slot1', 'slot2']) {
      $(slot + 'Device').disabled = paused;
      $(slot + 'Mode').disabled = paused || !$(slot + 'Device').value;
    }
    $('range').disabled = paused;
    if (!paused) refresh();
  });
  for (const slot of ['slot1', 'slot2']) {
    $(slot + 'Device').addEventListener('change', refresh);
    $(slot + 'Mode').addEventListener('change', refresh);
  }
  $('range').addEventListener('change', refresh);
  window.addEventListener('resize', refresh);
  refresh(); setInterval(refresh, 1500);
})();
</script>
</body>
</html>
